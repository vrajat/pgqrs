[package]
name = "pgqrs"
version.workspace = true
edition.workspace = true
description = "A high-performance PostgreSQL-backed job queue for Rust applications"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["queue", "postgresql", "async", "workflows"]

readme = "README.md"

include = [
    "migrations/**",
    "src/**",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
]

[[bin]]
name = "pgqrs"
path = "src/main.rs"



[dev-dependencies]
tokio-test = "0.4"
ctor = "0.2.4"
once_cell = "1.19"

serial_test = "3.2"
assert_cmd = "2.0"

[features]
default = ["postgres"]
sqlx = ["dep:sqlx"]
postgres = ["sqlx", "sqlx/postgres"]
test-utils = []

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
cron = "0.12.1"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "uuid", "json", "runtime-tokio-rustls", "macros", "migrate"], optional = true }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }


serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
pgqrs-macros = { path = "../pgqrs-macros", version = "0.15.3" }
tracing = "0.1"
serde_yaml = "0.9"
tabled = "0.20.0"
async-trait = "0.1"
futures-util = "0.3"
rand = "0.8"
url = "2.5"
sqlparser = { version = "0.62.0", features = ["visitor"] }

# cargo-release configuration for this crate only
# This hook runs once per workspace release (when processing this crate)
[package.metadata.release]
pre-release-hook = ["sh", "-c", "make -C $(git rev-parse --show-toplevel) bump-version VERSION={{version}}"]
