[package]
name = "pgqrs-extension"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]


[[bin]]
name = "pgrx_embed_pgqrs-extension"
path = "src/bin/pgrx_embed.rs"



[dependencies]
pgrx = { version = "=0.12.6", features = ["pg15"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["pg15"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg_test = []

[dev-dependencies]
pgrx-tests = "=0.12.6"



